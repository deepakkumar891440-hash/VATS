<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DEEPAK NOTES</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* App Container (Mobile screen view) */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #fdfdfd;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        @media (min-width: 421px) {
            .app-container {
                height: 85vh;
                border-radius: 30px;
                border: 8px solid #333;
            }
        }

        /* Header Section */
        .app-header {
            padding: 20px 20px 10px 20px;
            background-color: #fdfdfd;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 600;
            color: #222;
            letter-spacing: 0.5px;
        }

        .header-icons i {
            font-size: 20px;
            color: #555;
            margin-left: 20px;
            cursor: pointer;
        }

        /* Search Bar */
        .search-box {
            background-color: #f1f3f4;
            border-radius: 30px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box i {
            color: #70757a;
            margin-right: 12px;
            font-size: 16px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: #333;
        }

        /* Tabs (All, Call notes, Uncategorised) */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            background-color: #f1f3f4;
            color: #3c4043;
            transition: 0.3s;
        }

        .tab.active {
            background-color: #202124;
            color: #fff;
        }

        /* Notes List Area */
        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 80px 20px;
        }

        .note-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #f1f3f4;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .note-card:active {
            transform: scale(0.98);
        }

        .note-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 6px;
        }

        .note-card p {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-footer {
            font-size: 11px;
            color: #9aa0a6;
            font-weight: 500;
        }

        /* Floating Action Button (+) */
        .fab {
            position: absolute;
            bottom: 75px;
            right: 20px;
            width: 56px;
            height: 56px;
            background-color: #fbbc05; /* MIUI / Google Yellow theme */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }

        .fab i {
            font-size: 24px;
            color: #fff;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #fdfdfd;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #5f6368;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #202124;
            font-weight: 600;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        /* Modal for Adding New Note */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            padding: 24px;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }

        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #202124;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #dadce0;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        .modal-content textarea {
            height: 100px;
            resize: none;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btns button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-cancel {
            background: #f1f3f4;
            color: #3c4043;
        }

        .btn-save {
            background: #fbbc05;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-top">
                <div class="app-title">THE DEEPAK NOTES</div>
                <div class="header-icons">
                    <i class="fa-regular fa-folder"></i>
                    <i class="fa-solid fa-gear"></i>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search notes">
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tab active" onclick="filterTab('All', this)">All</div>
                <div class="tab" onclick="filterTab('Call notes', this)">Call notes</div>
                <div class="tab" onclick="filterTab('Uncategorised', this)">Uncategorised</div>
            </div>
        </div>

        <!-- Notes List -->
        <div class="notes-list" id="notesList">
            <!-- Dynamic notes will load here -->
        </div>

        <!-- Floating Add Button -->
        <div class="fab" onclick="openModal()">
            <i class="fa-solid fa-plus"></i>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-note-sticky"></i>
                <span>Notes</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-list-check"></i>
                <span>Tasks</span>
            </div>
        </div>

        <!-- Add Note Modal -->
        <div class="modal" id="noteModal">
            <div class="modal-content">
                <h2>New Note</h2>
                <input type="text" id="noteTitle" placeholder="Title (e.g., Pranshu 😍)">
                <textarea id="noteDesc" placeholder="Write something..."></textarea>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-save" onclick="saveNote()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initial Sample Notes matching your phone app style
        let notes = [
            { id: 1, title: 'Pranshu 😍🥰🥰', desc: 'Vdodndl Bldmdmr Bdod.', date: '10 August 10:57 PM', category: 'Call notes' },
            { id: 2, title: 'ENGINEERING GRAPHICS - 1ST SEMEST...', desc: 'VERY MOST IMPORTANT QUESTIONS WITH...', date: 'August 8', category: 'Uncategorised' },
            { id: 3, title: 'Richa sukla mam', desc: '303 (it Or electronics)', date: 'August 3', category: 'Uncategorised' },
            { id: 4, title: 'https://deepak-bhai-shop-01.verce...', desc: '...app/', date: 'July 20', category: 'Uncategorised' }
        ];

        let currentCategory = 'All';

        function renderNotes(filter = '') {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';

            const filteredNotes = notes.filter(note => {
                const matchesCategory = currentCategory === 'All' || note.category === currentCategory;
                const matchesSearch = note.title.toLowerCase().includes(filter.toLowerCase()) || note.desc.toLowerCase().includes(filter.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredNotes.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#888; margin-top:40px;">No notes here yet</p>';
                return;
            }

            filteredNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <h3>${note.title}</h3>
                    <p>${note.desc}</p>
                    <div class="note-footer">${note.date}</div>
                `;
                listEl.appendChild(card);
            });
        }

        function filterTab(category, element) {
            currentCategory = category;
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            renderNotes(document.getElementById('searchInput').value);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderNotes(e.target.value);
        });

        // Modal Controls
        function openModal() {
            document.getElementById('noteModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('noteModal').classList.remove('open');
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteDesc').value = '';
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const desc = document.getElementById('noteDesc').value;

            if (!title && !desc) return;

            const newNote = {
                id: Date.now(),
                title: title || 'Untitled',
                desc: desc,
                date: 'Just now',
                category: currentCategory === 'All' ? 'Uncategorised' : currentCategory
            };

            notes.unshift(newNote);
            renderNotes();
            closeModal();
        }

        // Initial render
        renderNotes();
    </script>
</body>
</html>
